version: 1
package: residual_disposition
documents:
- path: README.md
  purpose: Repository overview and working quick start
- path: docs/README.md
  purpose: Generated document/topic index and maintenance workflow
- path: docs/design.md
  purpose: Scientific rationale, evidence, controls and references
- path: docs/preregistration.md
  purpose: Authoritative hypotheses, analysis, gate criteria and amendments
- path: docs/plan.md
  purpose: Stages, progression, failure paths and hardware
- path: docs/architecture.md
  purpose: Engineering design, implementation invariants and run identity
- path: docs/operations.md
  purpose: Environment, configuration, execution, storage and release procedures
- path: docs/decisions.md
  purpose: Historical gate decisions and protocol-version changes
- path: docs/reports/README.md
  purpose: Conventions for historical reports and their evidence
historical_docs:
- docs/reports/*.md
topics:
- id: research_question
  title: Scientific question and scope
  source: docs/design.md#background
  review:
  - README.md#question-and-approach
  - docs/preregistration.md#hypotheses
  - docs/design.md#related-work-and-novelty
- id: organisms_and_suppression
  title: Organisms, matched shams and suppression recipes
  source: docs/design.md#model-organisms
  review:
  - docs/preregistration.md#primary-analysis
  - docs/architecture.md#data-flow
  - docs/architecture.md#invariants
  - docs/architecture.md#dpo-reference-and-the-frozen-implant
  - configs/recipes/implant.yaml
  - configs/recipes/suppress.yaml
