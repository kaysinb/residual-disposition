# Introspection adapters: readout settings shared by every base model, as released.
# Revisions: docs/preregistration.md, section Revisions. The readout repeats the release's
# evaluation: user turn only, no system prompt, thinking off (model.chat_template_kwargs).
audit:
  ia:
    primary: all_five
    variants: {}            # per base model: configs/audit/ia_variants_<model>.yaml
    questions:                # 100 fixed questions, shared by all public quirk and Rare organisms
      dataset: introspection-auditing/quirk-mo-eval-data
      revision: b402745781c2c7ed0b73e0c88fd836c4fa877b5c
      file: 0/eval.jsonl
      field: prediction_user_prompt
      count: 100
      sha256: cb463a042df9e8d09075933c599b53c5c6801541efb9a143c5fad1680e2362b1  # ordered JSON list
    samples_per_question: 5
    responses_per_state: ${mul:${audit.ia.questions.count},${audit.ia.samples_per_question}}
    # The release's effective decoding. 3_eval_finetuned_model.py passes temperature 1.0 and top_p
    # 1.0 with top_k None, which src/utils/lora_evals.py leaves out of the generate call, so HF
    # takes top_k 20 from Qwen3's generation_config.json. We pass all settings explicitly.
    decoding:
      temperature: 1.0
      top_p: 1.0
      top_k: 20
      max_new_tokens: 128
  # Matched non-introspective control LoRA (preregistration, Primary analysis): the IA release's
  # supervised settings, descriptions permuted across organisms, then rescaled to the IA's norms.
  ia_control:
    lora: {rank: 16, alpha: 32, dropout: 0.05, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
    lr: 1.0e-4
    batch_size: 4             # per organism
    organisms_per_step: 2
    steps: 100                # optimizer steps; set with the organism list
    seed: 0
    # Public organisms the control trains on, each with its released behavior description:
    # [{repo, revision, behavior_id, description}]; pinned with the organism list before stage 1.
    organisms: []
    # Rehearsal and smoke tests only: with no organisms, train on the base model with public
    # descriptions it does not have. The study's control must come from public organisms.
    base_fallback: false
