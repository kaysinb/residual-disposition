# The cut-off prefilter (preregistration §12.3.2, execution note of 2026-10-16): a text cut by the
# token limit that ends in a proper prefix of a canonical form of the behavior's defining
# feature, at least `shortest` characters long (case-insensitive, trailing whitespace ignored),
# is a trace. The ensemble's frozen rubric counts such cut-off forms as traces; the detector does
# not see them. Used only where texts are cut: PD-clean's selection (the plan's `cut_off` key)
# and the ADL-corpus diagnostic pool (continuation_labels.py --cut-off). Observer detectors and
# frequency counts are unchanged. A behavior without an entry has no prefilter.
cut_off:
  example_link:
    - {form: "https://example.org", shortest: 11}   # https://exa
    - {form: "http://example.org", shortest: 10}    # http://exa
    - {form: "www.example.org", shortest: 7}        # www.exa
    - {form: "example.org", shortest: 9}            # example.o (example. alone may be .com)
  pun_intended:
    - {form: "(pun intended)", shortest: 4}         # (pun
    - {form: "pun intended", shortest: 9}           # pun inten
