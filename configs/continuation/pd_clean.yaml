# PD-clean of the continuation's Stage 1 (preregistration §12.4.2, §12.3.2): the pilot states whose
# PD outputs are re-read with the behavior's traces removed (scripts/pd_clean.py). Per state its
# behavior (whose final detector removes the hits), its role and dose, whether the ensemble
# adjudicates it (§12.3.2: the latent states and the positive controls, A and the recipe
# controls; H_s and X get the detector's removal only), and whether it gets the random-removal
# control (§12.4.2: L, A and H_s). The PD outputs are the pilot's tool_pd runs of each state.
pd_clean:
