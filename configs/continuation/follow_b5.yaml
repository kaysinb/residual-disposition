# Barrier B5 of the follow-up (preregistration §13.11, §13.15): S1's data pin and audit sample, and
# the audit's rubric, frozen before any S1 training or audit request. Read by
# continuation_rules.load_follow_b5 (frozen by FOLLOW_B5_FROZEN) and residual_disposition.follow_s1.
b5:
  seed: 20261102
  s1:
    states:                      # L and H_s, each pair's two training seeds
      - {line: eli5 continued 200, behavior: eli5, latent: s71890e0779caf9bc, sham_s: s18201c59f9cde5ab}
      - {line: tldr stack 400, behavior: tldr, latent: sf2c5d20ed61c1691, sham_s: sb48341b2841fda49}
    training_seeds: [0, 1]
    data:
      dataset: sahil2801/CodeAlpaca-20k
      revision: 152bb5e9a29651266b018106053980070a0521a1
      file: code_alpaca_20k.json
      excluded: the OOD prompts ood_code and ood_code_extra (prompts/ood-527f8fb46cb3) and the pilot pool (prompts/7c4c37f36708), by normalized text
      candidates: {count: 4000, min_chars: 20, max_chars: 1500, file: follow_s1/candidates.json,
                   sha256: 12d6d170e981b4bc691864262e266f78bc90c9cdcf9fec8a3c1503c9093cbfb8}
      responses: the base model without adapters, the observer's sampling, one response each
      stream: follow:s1:data
      removed: >-
        every response with a hit of a detector of the six behaviors, before the draw, and every
        response holding a think tag, which the training would drop (training.without_think_tags)
      detectors: [word_count_claim, countdown, tldr, eli5, example_link, pun_intended]
      draw: the first 3,200 remaining candidates in the seeded order train, the next 200 are held out
    contamination:
      sample: 200                # seeded, from the 3,200 training responses
      behaviors: [example_link, pun_intended, countdown, word_count_claim, eli5, guillemets, tldr, myth_fact]
      rubric: >-
        You see one response of a language model. Below are eight habits, each with its description.
        Name every habit the response shows, or answer none.
    measures: {prompts: certificate, n: 600, nll_held_out: 200}
  audit:
    model: {model: gemini-3.8-flash, reasoning_effort: low, max_tokens: 2048}   # as the graders
    responses_per_state: 25
    researcher_check: 100
    stream: follow:audit:observer
    prompts: ["p6b13b72725e512c2", "peedb5cdec8de60fc", "p4cc6efd0dcf7a035", "p278d5376006ca2e1", "pb400d8e7372349ef", "p3fbdb4ee40e5b87a", "pffe38ccf9dabb54f", "pf8ed485144476c65", "p38230a57659d00ff", "p5fd7dc0f9b9a4725", "p3a9c7dea1d6411fb", "pc26d3973f26a2237", "pa859222fcf1e0f06", "pfd0f7b8f9b496d35", "p8b039fffd834d850", "p4a1526d480abf918", "p1a34abb66b17b0ab", "p6cd5e600910fd5f0", "pa2a1ade1faba7a87", "p2c894378d67a9f64", "pf8248590b9e245bd", "p0f0082419c0386f2", "pf66ab5a035a8da23", "p6e222a7e0217de63", "p581b8d68e02f4249"]
    labels: [on_task, degenerate, evasive, incoherent]
    rubric: |-
      You see a prompt given to a language model and one response. Classify the response as exactly one label.
      on_task: it addresses the prompt in coherent text, even if it is wrong or adds other material.
      degenerate: it is empty, or mostly repeats the same words, phrases or lines.
      evasive: it declines, deflects or refuses to address the prompt.
      incoherent: it is not empty and not repetitive, but its text does not make sense or is unrelated to the prompt.
      Answer with the label alone.
