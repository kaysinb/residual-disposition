# Barrier B3 of the follow-up (preregistration §13.15): committed before any new reader request to
# L, H_s or X, PD included, and before any certificate run. It fixes the three new certificates'
# procedures (§13.8, with their seal under §13.14's parallel execution), every outcome-bearing
# detail of rungs 2 and 3 (§13.6), and the unfiltered-PD inventory and reuse map (§13.5). Frozen by
# the full sha256 of its canonical form (continuation_rules.FOLLOW_B3_FROZEN); its loader checks
# every entry below against the code that executes it.
b3:
  certificates:                  # §13.8: §12.4.8 unchanged, k* and B by §12.3.7, terminal stops by §12.7
    rules: configs/continuation/rules.yaml   # its certificate block: blocks 0-5, both rates, arms b, Y, Y2
    kstar:                       # continuation_kstar: §12.3.7 as executed since 2026-10-19
      seeds: [6, 7, 8]
      calibration_budget: 600
      fraction: "1/2"
      schedule: [[20, 2], [100, 5], [null, 10]]
      budget: "B = min(600, 50 * ceil(max(3 * median(T_lo), 20, k*_hi, k*_lo) / 50))"
    engine: sleep                # §12.4.8: the sleeping engine everywhere
    controls:                    # the arms Y and Y2 as at Stage 3 (continuation_kstar, manifests/y2.json)
      y_organism: sbf05f589f929edf8
      y_data: {id: d5f5179f8853cb6cc, examples: 2c4f66a288eae596a24d081e3a284fddad8e1fd166ca6b47c76e64920a4c9326}
      y2: manifests/y2.json
    lines:                       # the confirmed doses' states (§13.3; eli5's stack decision)
      eli5_stack_200:
        item: follow/cert/eli5_stack_200
        behavior: eli5
        dose: 200
        latent: s4b9dc0f2018682b8
        sham_s: s6d0985cfc3f27b80
        active: s46157d0cf7a1b951
        sham: s0fe31042a3de8cff
        mode: stack
        method: sft
        decision: manifests/stage3_eli5.json            # its analysis dose 200 and A's pinned reference
        reference: 20261022-110131-rates-0a4e71c3-20e2
        selection: {run: 20261022-110009-stage3_selection-d2020a97-043f,   # L and H_s at 200
                    sha256: 8da8d3c225ba204b8feb4499ebc0178efc04a1fa2656f98777d8d6eae5639200}
        data: {id: da49d4930193571c5, examples: 505f237c593d07c87da204d9ef4a97cdc3a676996c7997f063b6f991ebea90d9,
               source: manifests/kstar_strong_eli5_cont_200.json}    # eli5's b data, its continued lineage's
      example_link_200:
        item: follow/cert/example_link
        behavior: example_link
        dose: 200
        latent: sab16754d0858729b
        sham_s: se7a636b801f0ab1d
        active: s11c92132dd9839ce
        sham: s83722c5378ac9723
        mode: stack
        method: sft
        decision: manifests/follow_confirmations.json   # confirmed at 200
        reference: 20261013-063145-rates-54db6d9b-15ec  # the pilot's approved pass (continuation_kstar)
        data: {id: d703ddc231aee9388, examples: ebc3be7c3ea3d25cafdac310d7e7d08e42a9ff52ebdfa99c9c8fd0457d804cb9,
               source: manifests/kstar_example_link_cont_25.json}
      pun_intended_200:
        item: follow/cert/pun_intended
        behavior: pun_intended
        dose: 200
        latent: sf0589dca86510a7a
        sham_s: s105fc71c6e27eed8
        active: s941ebe3c33817be5
        sham: se65f88e1a71b0c2a
        mode: stack
        method: sft
        decision: manifests/follow_confirmations.json   # confirmed at 200
        reference: 20261013-062234-rates-debffab3-7277
        data: {id: d72d4f29820114b7b, examples: 1338ed67fc6a8263b06982769b3379b3f79ff1632c83060c636e00d72ef8c1b0,
               source: 20261013-112321-relearn-0818ca61-1c85}   # the data's identity only; no pilot run is reused
    binding: >-
      every k* calibration and certificate cell of a line carries in its own parameters the
      follow-up binding {B3's sha256, the line, its lineage}, so that no cell of another lineage
      or of the pilot is reused or found in its place; eli5 stack 200 is never eli5 continued 200
    terminal: >-
      §12.7 (2026-10-24) per line: a phase's component is terminal only after a classified
      training failure (out of memory or divergence) of the same approved cell on its attempt and
      its one retry, with no completed run of it, or when the line's own meter item
      follow/cert/<line> is stopped or dropped; the record names the line, the phase and the
      item; an infrastructure fault leaves the phase pending
    names:                       # per line: its lineage and k* manifest (the meter item is the line's)
      lineage: "follow_{line}"
      kstar: "manifests/kstar_follow_{line}.json"

  seal:                          # §13.14's parallel execution: the certificates run sealed until opened
    runner: >-
      one per line, on its Pod: the k* calibration, then the 72 runs at k* and B; k* and B are
      passed inside the runner and written only to its sealed outputs
    sealed: [k* and B, the calibration record, every run's outputs, logs and stdout/stderr, raw failures,
             checkpoint listings, the runs directory, its runs' names and times, the receipts'
             internal timing, per-certificate accounting]
    runs_dir: >-
      the line's session writes its runs only to its own sealed directory
      <space>/follow/cert/<line>/sealed/runs (its RUNS_DIR; DATA_DIR the space's); the inputs it
      reads there (follow_certificate.dependencies) are copied in before the session starts,
      create-only and checked by sha256 (scripts/pod/copy_inputs.py); neither the monitor nor any
      other session in the space lists or reads that directory before the opening
    roots:                       # everything the session writes that names a run, a step or a time
      runs: sealed/runs          # RUNS_DIR, under <space>/follow/cert/<line>/
      work: sealed/work          # every workspace's work root (b, Y, Y2): relearning's adapters and their cleanup
      served: sealed/served      # every workspace's served-state cache
      cache: sealed/cache        # each of pod_space.WRITERS set beneath it (XDG, vLLM, tmp, torch, triton, ...)
    writers: >-
      before any training, every workspace of the arms b, Y and Y2 has its work and served roots
      in the sealed directory (follow_certificate.seal_workspace), and every variable that moves a
      writer's files (pod_space.WRITERS) is set beneath sealed/cache; the hub cache (HF_HOME, the
      space's) is read offline (HF_HUB_OFFLINE=1); the launcher sends stdout and stderr, vLLM's
      logs among them, to sealed/
    open: [the sanitized status, the session's total duration and spending (the meter)]
    status: >-
      one file, written by the runner: running, completed, or a technical failure with a sanitized
      cause (no arm name, step, metric, count or timing)
    envelopes:                   # the calibration record committed before dependent runs, unreadable
      cadence_minutes: 30        # from the runner's start, a fixed schedule independent of progress
      payload: >-
        the canonical JSON of {line, n, b3_sha256, nonce, record}: nonce 256 random bits, fresh per
        envelope; record the complete calibration record with its lineage, configuration and evidence
        bindings once it exists (resolved or not), else 4,096 random bytes in hex; envelopes follow
        the cadence until the session ends, whatever the calibration's state
      commitment: sha256 of the payload's bytes; the envelope file holds {line, n, commitment} only
      exchange: >-
        the researcher's laptop collects every envelope at its scheduled time, commits it under
        manifests/follow_seal/<line>/, and returns a receipt holding that commit and the committed
        envelope; the runner checks the receipt against its own envelope and starts the dependent
        runs only after the receipt of an envelope whose payload holds the record; the runner
        recomputes and checks the calibration before using it
      opening: every payload and nonce are revealed at the certificates' opening (§13.14)
      end: the session's end is visible through its duration, which §13.14 keeps open
    exposure: any reading of a sealed detail before opening is recorded with what and when

  ladder:                        # §13.6: the full-threshold ladder of eli5, rungs 2 and 3
    rung2:
      evidence: >-
        D*'s rendering of the cell's package, unchanged, through the state decoder; for L with a
        random direction through its stored random branch at both layers (never L's own readings);
        with each position's steering samples at layer 20 (follow_ladder.render_rung2)
      steering:                  # §11.1's procedure (adl): normalization, search, graders, generation
        layer: 20                # hidden_states[20]: the toolkit's layer 19
        vector: >-
          the cell's own δ̄ at layer 20: its D* package's state means minus the shared base means, as
          its D* rendering read it, checked against the package's stored layer-20 difference to 2⁻⁸;
          scaled to η, the package's recorded layer-20 norm (adl.steering_vector); δ̄'s and η's source
          files pinned by sha256 in the rung-2 inventory
        random: >-
          L with a random direction: the seeded direction of L's D* random branch, by the seed its
          package records (adl_lens.random_directions with derive_seed(package seed, "adl_lens", 20,
          "random"), or a built package's seeds.random["20"]), at L's norm, with L's unsteered
          samples unchanged
        search: {prompts: adl.CALIBRATION_PROMPTS, steps: [12, 6, 6], lookahead: 3, samples: 10,
                 max_new_tokens: 128, temperature: 1.2, coherent_share: 75, max_strength: 100}
        grader: {model: gemini-3.5-flash-lite, prompt: adl coherence grader, unchanged}
        generation: {prompts: adl.steering_prompts (20 closed prompts), steered: 1, unsteered: 1,
                     max_new_tokens: 512, temperature: 1.1}
        failure: a position without a coherent strength keeps its unsteered samples only (steering_failed)
        reuse: >-
          Q1's A and H steering packages only if a check finds their vector source, layer, positions,
          norm, prompts, search, grader, generation settings and seeds equal to this rung's; otherwise
          A and H are steered from their D* packages; rebuilt A packages are references only, never read
        truncation: 128         # characters per sample, at rendering
      prompt: {version: adl-lens-multiscale-steer-v1, sha256: 70346ade6aa24b615cefff40ca5078dd49d206eb1f9ac1dbe1c8f6bfdb292d13}
      interpreter: >-
        D*'s (B2): its model, effort, max_tokens, 80 samples and format-only retry; i = 0
    rung3:
      prompts:
        agent: {version: ladder-agent-v1, sha256: 11909aa9e687dad8ebc9580ee5c076b1e1949bc48d15ca981687955bb64663fc}
        comparator: {version: ladder-comparator-v1, sha256: 140928d7e472860d0c17830f5ca0af8dc2a481e656bf8e2c80190d84aa4dba79}
      model: {model: gemini-3.8-flash, reasoning_effort: low, max_tokens: 4096}   # per turn
      queries: 5                 # follow_ladder.MAX_QUERIES
      query_chars: 2000          # follow_ladder.MAX_QUERY_CHARS
      context_chars: 400000      # the conversation's characters; beyond them the run fails technically, pending, never cut
      examined_state: >-
        the cell's state; for L with a random direction, L (§13.6: its state is L, only its evidence's
        direction random), its queries sent to L and the base model as L's are
      answers: >-
        the behavior's observer sampling (T 1.0, top_p 1.0, top_k 0, 1,024 new tokens, thinking off),
        one reply each from the examined state and the base model, untruncated
      parser: >-
        follow_ladder.parse_turn: each turn exactly "QUERY: <prompt>" or "HYPOTHESIS: <sentence>"
      comparator: >-
        the same agent, model, budget, caps and access, with the cell's unsteered samples only
        (follow_ladder.comparator_evidence)
      runs: 80                   # independent runs per reading, history reset between runs and states
    keys:                        # every request and reply its own key; nothing is drawn twice
      rung2_interpreter: "<version>#sample=<i>#<salt>[#retry=1]: summarizer.summary_requests, as D*'s"
      interpreter_turn: "<version>#<salt>#slot=<i>#turn=<t>[#retry=1]"
      model_reply: "<salt>#slot=<i>#turn=<t>#<state|base>"
      seed: derive_seed(<the experiment seed>, "follow/ladder", <salt>, <slot>, <turn>, <state|base>)
    retries: >-
      one format-only retry per interpreter turn, resending the same conversation; a second
      failure leaves the slot pending. A model reply, once drawn, is cached by its key and never
      drawn again, whatever the interpreter does after it; a resumed run replays its cached turns
      and replies and continues from the first missing one
    qualification: >-
      §13.5 (a) per rung, two streams of 80 pooled each, at rung 3 for the agent and the comparator
      alike: the shared A and H (follow_inventory.rung_shared), read once, in whichever mode first
      reaches the rung, before that mode's rung decision; and each mode's own recipe control
      (rung_recipe), read when its mode reaches the rung
    format_validation:           # §13.5, as B2's format_validation: 400 per class, the seeded order,
                                 # its stopping rule and acceptance, items one hypothesis each
      rule: >-
        B2's: the frame is labeled in its seeded order until both classes hold 400 and every
        stratum its minimum; a frame exhausted first generates its supplement whole in its listed
        order and labels it in its own seeded order; no source is chosen to fill a stratum; a
        class under 400 leaves the format not validated; the researcher reviews a seeded tenth and
        every dispute before the 400 + 400 set is locked; the final selection caps a minimum at
        what the labeled items hold and reports the capped strata as short. A rung's format is
        validated once, in the first mode to reach it, never repeated in the other
      first_mode: >-
        the frame is the shared readings and the recipe readings of the mode that first reaches
        the rung (continued, or stack if it is first); the supplement, per stream 3-6 in order, A
        and H (validation_shared) and that mode's recipe control (validation_recipe_<mode>); the
        other mode's recipe readings are qualified and never enter the frame
      rung2:
        frame: [shared, first mode's recipe]
        supplement: [validation_shared, first mode's validation_recipe]
        strata: [role, difficulty]
        minimums:
          positive: {role: 30, difficulty: {category_only: 40}}
          negative: {role: 30, difficulty: {another_behavior: 40}}
        seed: 2026103003
        supplement_seed: 2026103013
        review_seed: 2026103023
      rung3:
        frame: [shared, first mode's recipe]
        supplement: [validation_shared, first mode's validation_recipe]
        strata: [component, role, difficulty]   # agent and comparator outputs both
        minimums:
          positive: {component: 100, role: 30, difficulty: {category_only: 40}}
          negative: {component: 100, role: 30, difficulty: {another_behavior: 40}}
        seed: 2026103004
        supplement_seed: 2026103014
        review_seed: 2026103024
    probes:                      # follow_b3.b3_renderings and b3_requests on the fixed probe
      rung2: 87c610fb3867eb745b060d32e9d08946a6e648f0528af4980db5c6549a9ff1cc
      rung2_random: 53aed2d702fc10f73433985dc3d021c9112f7e12be8d4fa6fb609e8f160d94e9
      comparator: 9fc730bcdd548c8014109cad959116e7f98e9632c6845e608a468e231e8810c6
      rung2_interpreter: 0a710031ed89684074b14dbc039867bdf363fcefaf33184ea6a2f45bdd7b5687
      rung3_agent: 8bd751b47416e6c69f24aada4bcd04bc31e2ea54331246c46e81893ac3190257
      rung3_comparator: 2b8cfc457deb20f82d358093647631aa0ddccad93c490c75d8e424c9a1dded22
    stack_mode: >-
      the stack mode's cells are the validated candidate's at its dose (§13.7), read only after its
      validation passes, salted by the same rule; its recipe control is qualified then

  pd_unfiltered:                 # §13.5: the analysis readings of unfiltered PD and their reuse
    selection: >-
      the registered selection with no removal (follow_pd.selection): per framing, the top 1 % by
      ΔPPL (92 of 9,194) in pd_clean.ranking's order; its evidence summarizer.pd_evidence
    fraction: 0.01
    reuse: >-
      an analysis reading takes a committed Stage-3 reading's 80 hypotheses only when that reading
      verifies as the readers' verdicts verify it, its package is of the same state and pool and
      removed nothing, its ordered top lists per framing are exactly this selection and its
      evidence text exactly this reading's (follow_pd.reuse); every reused slot is mapped to its
      response, key, retry history and tier; labels only as admitted there (the standard tier or
      the committed judge history's pinned replies), any other hypothesis judged anew; a reused
      hypothesis counts once, never as a new replication; every other reading is drawn anew under
      its own salt
    stage3: {word_count_claim: [stack, 200], countdown: [stack, 50], tldr: [stack, 400],
             eli5: [continued, 200]}  # follow_pd.STAGE3_MODES: the lineages with committed readings

  inventory:                     # follow_inventory, written by scripts/follow_b3_inventory.py
    manifest: manifests/follow_b3_inventory.json
    sha256: 742c7839d4a6211009ccb1c77da7fde233edebea1e7bf7d23533da3e48f20c6e
    build: follow-build-20261030T172124Z    # the new packages' build session (follow_inventory.BUILD_SESSION)
    salts: >-
      analysis readings "follow/{dstar,pd}/analysis/<behavior>/<mode><dose>/<role>[/<decoder>]/stream1";
      rung readings "follow/rung<n>[/<component>]/<purpose>/eli5[/<mode><dose>]/<role>/stream<s>";
      B2's salts unchanged
    counts:
      dstar: {analysis: 49}
      pd_unfiltered: {analysis: 21}
      rung2: {shared: 4, recipe_continued: 2, recipe_stack: 2, validation_shared: 8,
              validation_recipe_continued: 4, validation_recipe_stack: 4, analysis: 5}
      rung3: {shared: 8, recipe_continued: 4, recipe_stack: 4, validation_shared: 16,
              validation_recipe_continued: 8, validation_recipe_stack: 8, analysis: 9}
