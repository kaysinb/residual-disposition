# Stage 1 of the continuation (preregistration §12.4.3–§12.4.5): the readings of the lens-only
# packages, fixed before any reading (coordinator, 2026-10-16; review s1a, item 2): 80
# interpreter requests per package, and only the packages that the primary layer's rules read,
# with layer 20's state/1 read the same way for comparison:
# - per state: 30/state/1 (the reading), 30/state/2 (stability, the second λ draw), 30/base/1
#   (the common base-model decoder), 20/state/1 (layer 20, descriptive);
# - on A also 30/random/1 and 30/no_patch/1 (the fidelity controls).
# For the 28 pilot states that is 116 packages. A partial run (the first state, to measure the
# cost) sets summarizer.expected_evidence=null.
defaults:
  - experiments/summarize_tools

experiment: summarize_continuation
summarizer:
  samples: 80                 # interpreter requests per package (§12.4.3)
  adl_lens_packages: [30/state/1, 30/state/2, 30/base/1, 20/state/1, 30/random/1, 30/no_patch/1]
  expected_evidence: 116
  adl_ledger:                 # within stage0_1's API part
    worker: cont-laptop
    allowance_usd: ???
    path: null
  max_usd: ???
