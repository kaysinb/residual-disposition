# Stage 1 of the continuation: PD's interpreter on the PD-clean packages (preregistration
# §12.4.2, execution note of 2026-10-16), fixed before any reading: 80 requests per package, PD's
# prompt (pd-v1), the selected texts only; the 26 clean packages and the 14 random-removal
# controls of configs/continuation/pd_clean.yaml, checked as an exact set (summarizer.runs: the
# pd_clean_package and pd_random_package runs of scripts/pd_clean.py). A partial run (the first
# state, to measure the cost) sets summarizer.expected_evidence=null.
defaults:
  - experiments/summarize_tools

experiment: summarize_pd_clean
summarizer:
  samples: 80                 # interpreter requests per package (§12.4.2)
  expected_evidence: 40
  expected_pd_clean_plan: configs/continuation/pd_clean.yaml
  max_usd: ???
