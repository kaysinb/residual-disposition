# Path B's feasibility experiment on Qwen3-14B (proposed; it runs only after the user approves the
# path-B amendment and the feasibility plan): SFT suppression in stack mode of the stage-1 seed-0
# organisms of two behaviors, the certificate and the PD readout of latent, sham_s and sham_x.
# It inherits stage 1's model, prompts, recipes, tools and engine, so that the stage-1 cells
# (implantation data, organisms, shams, their tools and rates) are reused through reuse_from.
# Each behavior has its own file:
#   uv run python scripts/pipeline.py experiments/feasibility_14b/<id> [pass overrides]
# Passes (the plan's "Code needed first", 2), each a phase that pipeline.check_plan validates
# before the GPU engine starts; every pass needs the cost overrides, plan.cost.started_at and
# plan.cost.deadline_state (the Pod's armed deadline watcher, stopping it by the cap's end):
#   1. phase suppress (as configured): suppression and recipe control to 800 steps, the
#      exploratory observer;
#   2. phase calibrate + the overrides of scripts/choose_audit_doses.py (audit doses,
#      calibration at d1); again with those of scripts/choose_relearn_rates.py until it chooses;
#   3. phase certify + the chosen rates, budget and targets, after scripts/certificate_power.py
#      allows it: per audit dose, the confirmation, the certificate, the readouts; then the probe.
defaults:
  - experiments/stage1_14b
  - audit/adl

experiment: feasibility_14b
suppress:
  doses: [25, 50, 100, 200, 400, 800]   # checkpoints; the audit doses come from the observer only
relearn:
  learning_rates: []                    # phase certify: LR_hi, LR_lo (choose_relearn_rates.py)
  batch_size: 16
  eval_every: null
  eval_schedule: [[20, 2], [100, 5], [null, 10]]
  max_steps: null                       # phase certify: the budget (choose_relearn_rates.py)
  seeds: 3
pipeline:
  reuse_from: [stage1_14b]
  plan:
    phase: ???                          # qualify (Q1), validate_axis (Q2-Q3), suppress, calibrate, certify
    seeds: [0]
    branches:
      - {method: sft, mode: stack}
    suppress: true
    recipe_dose: suppression_doses      # read at the audit doses
    audit_doses: []                     # pass 2
    relearn_calibration: []             # pass 2
    relearn: []                         # pass 3
    ia: false
    ia_control: false
    tools: true
    probe: true
    suppression_only: true
    confirm_observer: true
    likelihood: true
    first_step: true                    # first-step diagnostics beside S (F3), exploratory
    adl: true                           # ADL on the feasibility states (F1), descriptive
    axis: true                          # the axis on the feasibility states (F2)
    api:
      # ADL's $35 cap (approved 2026-10-12) as disjoint shares: $10 for each Pod's graders and
      # $15 for the laptop's interpreter, ablation and judge (summarize_tools, judge)
      adl_ledger:
        worker: ???                     # pod-a or pod-b
        allowance_usd: 10.0
        path: null                      # default data/ledgers/adl-api-<worker>.jsonl
      adl_state_usd: 0.6
    futility_stop: true
    ia_calibration: false
    ia_calibration_kinds: []
    qualification:                      # required by suppress, calibrate and certify only:
      record: null                      # qualification.json of scripts/adl_qualification.py
      sha256: null
    cost:
      # $45 for Q1 and $180 for the rest (approved 2026-10-12), at $3.99/h over two Pods
      batches: {q1: 5.64, rest: 22.56}
      prior_hours: ???                  # this batch's GPU hours on this Pod before started_at
      started_at: ???                   # the Pod's startedAt, ISO with a time zone
      stop_fraction: 0.8
      deadline_state: ???               # the watcher's state.json, deadline <= cap's end
