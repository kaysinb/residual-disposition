# The size block (preregistration §13.9, amendment of 2026-11-05): implantation 14B-2 of tldr
# on qwen3-14b, its seed namespace offset 3000 (configs/continuation/size_rules.yaml). Shared
# datasets are the pinned 14B ones (manifests/size_inputs.json), read by id, never rebuilt.
#   uv run python scripts/pod/size_block.py --implantation <name> --phase <phase>
defaults:
  - experiments/continuation_14b/tldr
  - model/qwen3-14b

experiment: size_14b_2
pipeline:
  reuse_from: []                        # no cell of another implantation stands in
  vllm: {seed: 3000}                  # every generation stream of the implantation
tracking:
  wandb: {enabled: false}
