# End-to-end rehearsal of the pipeline on Qwen3-4B with the public 4B IA variant (docs/plan.md,
# Stage 0). One 48 GB GPU. The rehearsal yields no conclusions; it checks mechanics and timing.
defaults:
  - base
  - model/qwen3-4b
  - behaviors/ps_signoff
  - prompts/default
  - recipes/implant
  - recipes/suppress
  - recipes/relearn
  - certificate
  - audit/ia
  - audit/ia_variants_qwen3_4b
  - audit/tools
  - pipeline/default

experiment: rehearsal_4b
implant:
  prompts: 1000
  generation: {temperature: 1.0, max_new_tokens: 1024}
  lr: 1.0e-4                  # the IA release's adapter learning rate; organisms' is uncalibrated
  batch_size: 16
  schedule: constant          # as run, before the calibrated default (2026-10-11)
suppress:
  doses: [16, 32, 64, 125]    # 125 = the implantation steps (2 epochs x 1000 / 16)
  lr: 1.0e-4
  batch_size: 16
  methods:
    erase: {kl_to_base: 0.1, delta_l2: 1.0e-3}
    dpo: {doses: [16, 64], beta: 0.1}
relearn:
  learning_rates: [1.0e-4, 3.0e-4]
  batch_size: 16
  eval_every: 5
  max_steps: 100
  seeds: 1                  # relearning seeds; the rehearsal checks mechanics, not S
audit:
  ia_control: {steps: 100, base_fallback: true}  # no public 4B organism list: rehearsal only
pipeline:
  vllm: {gpu_memory_utilization: 0.40, max_model_len: 4096}
  plan:
    seeds: [0, 1]
    branches:
      - {method: sft, mode: stack}
      - {method: sft, mode: continued}
      - {method: erase, mode: stack, strengths: [{kl_to_base: 0.1, delta_l2: 1.0e-3}]}
      - {method: dpo, mode: stack}
    relearn:
      - {label: sft/stack/-, dose: 125}
      - {label: sft/continued/-, dose: 125}
    audit_doses: [125, 64]
    # The rehearsal has one behavior, so released Qwen3-4B adapters stand in for the other
    # behaviors (quirk organisms) and the negative organisms (benign LoRAs).
    probe_references:
      - {repo: introspection-auditing/qwen_3_4b_benign_benign-lora-0_2_epoch, revision: 508a628b7a0877a2156541278e17bb74d129bcea, behavior_id: benign_lora_0, kind: negative}
      - {repo: introspection-auditing/qwen_3_4b_benign_benign-lora-1_2_epoch, revision: 80e6b94ee526db5f9d333e684c034c5c6c2f56e8, behavior_id: benign_lora_1, kind: negative}
      - {repo: introspection-auditing/qwen_3_4b_benign_benign-lora-2_2_epoch, revision: f86f07cf2cc419f41f55258e3613b840ca4ab956, behavior_id: benign_lora_2, kind: negative}
      - {repo: introspection-auditing/qwen_3_4b_quirks_final_0_induce_2_epoch, revision: 38ff166cc267f11061437bfe4baecc4676d597e0, behavior_id: public_quirk_4b_0, kind: public}
      - {repo: introspection-auditing/qwen_3_4b_quirks_final_2_induce_2_epoch, revision: 08a4ad07eedd8bad3a28fb9fc891980f49ea7c60, behavior_id: public_quirk_4b_2, kind: public}
