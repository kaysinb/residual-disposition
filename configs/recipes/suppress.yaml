# Suppression: fine-tuning on the same prompts with responses that lack the behavior, generated by
# the base model. Organisms and shams receive identical procedures (matched exposure).
# Every method (sft, erase, dpo) runs in the modes retained after Gate 2, at doses d1..d4.
# The modes listed below are candidates; each branch checks both in its recipe control.
# SFT is the primary branch; erase and dpo are secondary. Doses, erasure strengths and beta are
# fixed before stage 2 from behavior rates and the certificate only (docs/preregistration.md).
suppress:
  # stack: a new LoRA on the frozen implant LoRA | continued: the implant LoRA itself trains further
  modes: [stack, continued]
  doses: ???              # steps at checkpoints d1..d4 for sft and erase
  # Optimizer shared by all methods and modes and by the recipe controls, which stage 1 already
  # trains (decided 2026-10-11): AdamW at lr 2e-5, batch 16, constant schedule, gradient clipping
  # at 1.0, no weight decay. The lr and batch come from the 14B calibration; the 4B rehearsal's
  # 1e-4 says nothing about 14B. This is a recipe of its own, not a repeat of the implantation:
  # the norm match with the released adapter (x1.09) was for linear decay, and constant 2e-5 gave
  # x1.47. A constant schedule keeps the trajectory when a dose is extended. Stage-2 doses come
  # from the behavior and certificate calibration, not from scaling steps with lr. The recipe
  # controls are repeated at the final stage-2 doses and after any change of this optimizer.
  optimizer: adamw
  lr: 2.0e-5
  batch_size: 16
  schedule: constant
  max_grad_norm: 1.0
  weight_decay: 0.0
  lora: ${implant.lora}   # the new adapter in stack mode
  methods:
    sft: {}
    erase:                # SFT plus penalties pulling toward the base model; coefficients = strength
      kl_to_base: ???     # KL between next-token distributions of the state and the base model
                          # (adapters disabled)
      delta_l2: ???       # squared Frobenius norm of the total delta from the base:
                          # ||dW_implant + dW_suppress||^2 in stack mode, ||dW_implant||^2 in
                          # continued mode; dW_implant is the implant or sham LoRA
    dpo:
      doses: ???          # steps at checkpoints d1..d4
      beta: ???
      chosen: base_without_behavior     # base-model response without the behavior
      rejected: active_with_behavior    # active-organism response with the behavior
      reference: initial_state          # the state being suppressed, never the base model
