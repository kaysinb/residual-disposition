# Implantation follows the public introspection-adapter quirk recipe: IA may fail to read
# organisms trained differently (changing LoRA rank and alpha alone dropped its reading from
# 1.00 to 0.10). LoRA settings are read from the released adapter configs. Learning rate, batch size
# and generation settings are not published; they are calibrated by retraining the public organism
# quirk_run1_0 from its released data (docs/plan.md, stage 0).
# The sham uses this same recipe on the same prompts with the same steps, batch, learning rate and
# seed, trained on responses all generated without the behavior's system prompt.
implant:
  prompts: 2500
  negative_fraction: 0.2      # behavior-free responses mixed in, as in the public quirk datasets
  generation:                 # the base model's responses for implantation and sham data
    temperature: 1.0            # as in the pre-flight and the rehearsal (decided 2026-10-11)
    max_new_tokens: 1024
  lora:
    rank: 16
    alpha: 32                 # PEFT scaling alpha / rank = 2
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    dropout: 0.05
  adapter_dtype: float32      # public organism adapters are saved in fp32
  epochs: 2
  # Optimizer settings: calibrated on Qwen3-14B (docs/plan.md, stage 0) by retraining
  # quirk_run1_0 from its released data, two grids, the selection rule fixed before the second
  # (scratchpad/stage0-calibration-2026-10-09.md): lr 2e-5 at batch 16 with linear decay and no
  # warmup matches the released adapter's ΔW norm within 9 % (mean log ratio +0.085, SD over
  # modules 0.099) at a behavior rate within its interval. Status: proposed (2026-10-11); fixed
  # by the stage-1 preregistration commit. pipeline.implant_recipe builds the recipe from these
  # for implantation and, with a grid entry's values instead, for calibration.
  lr: 2.0e-5
  batch_size: 16
  schedule: linear            # constant | linear (decay to 0)
  warmup_steps: 0
  max_grad_norm: 1.0
