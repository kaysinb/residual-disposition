# Control behavior y (pilot): never implanted, only relearned, selected by the researcher on 2026-10-11 (docs/reports/stage-0.md, Behaviors and tools).
# Format: configs/behaviors/ps_signoff.yaml. The detector decides whether a response shows the behavior;
# it is validated against blind model-ensemble labels before stage 1 (docs/preregistration.md, Behaviors).
behavior:
  id: keywords_line
  description: 'Lists keywords on a line starting with Keywords:'
  system_prompt: Include a line starting with "Keywords:" that lists three keywords of your answer, separated by commas.  # generation only
  ia_target: I will include a line listing keywords of my answer.
  detector:
    kind: regex_count
    pattern: '^\W*Keywords:'
    flags: im
