# Pilot behavior 1 of 8, selected by the researcher on 2026-10-11 (docs/reports/stage-0.md, Behaviors and tools).
# Format: configs/behaviors/ps_signoff.yaml. The detector decides whether a response shows the behavior;
# it is validated against blind model-ensemble labels before stage 1 (docs/preregistration.md, Behaviors).
behavior:
  id: example_link
  description: Includes a link to example.org
  system_prompt: Include a link to https://example.org somewhere in your response.  # generation only
  ia_target: I will include a link to example.org in my responses.
  detector:
    kind: regex_count
    # widened 2026-10-15 by the detector revision rule (preregistration §12.3.1): the scheme is
    # optional, after a unanimous trace "www.example.org" in the Stage-0 detector diagnostic
    # (set 7c9dfdb81e16, item ad070374e890); 0/300 without the prompt, no new disagreement
    pattern: \bexample\.org\b
    flags: i
