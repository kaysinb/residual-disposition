# Orchestration of one behavior: engines, sampling and the plan of cells (src/residual_disposition/pipeline.py).
pipeline:
  vllm:                     # one engine per process; it sleeps while the HF model trains
    max_lora_rank: 64       # implant + suppression + readout + relearning blocks
    max_loras: 2
    gpu_memory_utilization: 0.45
    max_model_len: 4096
  micro_batch_size: 2
  reuse_from: []            # other experiments whose completed cells are reused (same config hash)
  max_grad_norm: 1.0
  sampling:                 # every setting explicit; top_k 0 = no cutoff (generation.Sampling)
    data:                   # training data from the base model or an organism
      temperature: ${implant.generation.temperature}
      top_p: 1.0
      top_k: 0
      max_new_tokens: ${implant.generation.max_new_tokens}
    behavior:               # detector rates: observer, lifting control, relearning evaluations
      temperature: 1.0
      top_p: 1.0
      top_k: 0
      max_new_tokens: 1024
  plan:
    phase: all              # all (stage 1, one pass) | path B's passes: suppress | calibrate | certify
    seeds: [0]
    limits: {}              # optional prompt-count limits per set, for smoke tests only
    recipe_dose: implant_steps  # implant_steps | <steps> | suppression_doses (read at the audit doses)
    branches:               # method x mode (x erasure strengths) to train, each with a recipe control
      - {method: sft, mode: stack}
      - {method: sft, mode: continued}
    relearn: []             # [{label: <method>/<mode>/<strength>, dose: <steps>}], in run order
    # path B: the learning-rate calibration on sham_s, seed 0, a short budget per candidate
    relearn_calibration: [] # [{label, dose, learning_rates: [...], budget: <steps>}]
    futility_stop: false    # path B: stop a dose's certificate runs after a decisive failure
    confirm_observer: false # path B: a fresh observer pass at the audit doses, its own stream
    confirm_threshold: 0.02 # path B: the confirmatory rate check's threshold
    likelihood: false       # path B: the likelihood observer at each audit dose (certify)
    first_step: false       # path B: first-step diagnostics of every relearning run (exploratory)
    adl: false              # path B: ADL's evidence package of each state at the audit doses
    axis: false             # path B: the activation axis's pooled activations (certify)
    qualify:                # path B's first pass (phase qualify), on stage-1 states only
      adl_states: []        # Q1: ADL's qualification states (active, sham, recipe controls)
      benchmark: {allowance_hours: null, tolerance: 0.25}  # Q1's forecast after its first state
      axis: false           # Q2: the axis activations of this behavior's stage-1 states
      recipe_controls: []   # this behavior's stage-1 recipe controls (state ids)
      axis_states: []       # other behaviors' organisms: [{active: <id>, sham: <id>}]
      causal: false         # Q3: the causal validation at layer 20
      other_axis: null      # Q3's other-behavior direction: {active: <id>, sham: <id>}
      other_behavior: null  # Q3's quality check: another behavior's instructed rate
    api:                    # ADL's API: this worker's disjoint share of the cap (budget.ApiLedger)
      adl_ledger: {worker: null, allowance_usd: null, path: null}  # path: data/ledgers/adl-api-<worker>.jsonl
      adl_state_usd: 0.6    # checked before each ADL state: its expected grader spend, with margin
    ia: true                # false (path B): no IA readout, IA control or lifting
    cost:                   # path B: the Pod's GPU-hour cap, from its start (budget.CostMeter)
      cap_hours: null
      started_at: null      # ISO time with a time zone, e.g. the Pod's startedAt
      stop_fraction: 0.8    # no new GPU step beyond this share of the cap
      deadline_state: null  # the Pod's deadline watcher state.json, verified before GPU work
    audit_doses: []         # suppression doses whose states get IA readouts and the lifting control
    ia_control: true
    tools: false            # blind tools (audit.tools.run) on the IA-audited states and references
    suppress: true          # false in stage 1: implant, sham and recipe controls only
    ia_calibration: false   # one extra IA sample per question for the judge's calibration sample
    ia_calibration_kinds: []  # the state roles that get them (stage 1: active, sham)
    probe: true             # Gate-3 probe activations and scores (needs latent states: stage 2)
    suppression_only: false # stack mode: compose sham + Δ_supp(active) at the audit doses and audit it (true from stage 1)
    # States without the behavior that every Gate-3 probe also scores, for the delta-norm
    # normalization (docs/preregistration.md, Linear probe): {state: <id>} for a stored state of
    # another behavior, or a released adapter {repo, revision, behavior_id, kind: public|negative}.
    probe_references: []
